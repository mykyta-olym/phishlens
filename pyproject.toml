[project]
name = "phishlens"
version = "0.1.0"
description = "Scores how likely a URL is to be phishing from the URL string alone, and explains each score."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mykyta Olym", email = "mykyta.olym.work@gmail.com" }]
dependencies = [
    "fastapi",
    "lightgbm",
    "numpy",
    "publicsuffixlist",
    "uvicorn",
]

[project.scripts]
phishlens = "phishlens.cli:main"

[dependency-groups]
train = [
    "fsspec",
    "aiohttp",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "joblib>=1.6.0",
]
dev = [
    "httpx2>=2.16.0",
    "mypy",
    "pandas-stubs",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.uv]
default-groups = ["dev", "train"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S", "C4", "PT", "RET", "ARG"]
ignore = [
    "PLR0913", # the training entry points take several explicit options
    "PLR0917", # same reason
    "PLR2004", # thresholds in feature code read better inline
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["lightgbm.*", "pyarrow.*", "fsspec.*", "sklearn.*", "scipy.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = ["data: needs the downloaded datasets under data/raw"]
